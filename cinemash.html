  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

der-val=\"{{ false }}\">\n    <div>\n      <div style=\"font-size:11px;letter-spacing:1.5px;font-family:var(--font-heading);opacity:.7;margin-bottom:4px\">PLAYER NAME<\u002Fdiv>\n      <input value=\"{{ aName }}\" sc-camel-on-change=\"{{ onAName }}\" placeholder=\"e.g. FILMI4LIFE\" style=\"width:100%;box-sizing:border-box;border:2px solid #fff;padding:12px;font-family:var(--font-heading);font-weight:700;font-size:15px;outline:none;background:#fff;color:var(--color-text)\" style-focus=\"border-color:var(--color-accent)\">\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:11px;letter-spacing:1.5px;font-family:var(--font-heading);opacity:.7;margin-bottom:6px\">PICK AN AVATAR<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ avatars }}\" as=\"av\" hint-placeholder-count=\"8\"><button style=\"{{ av.st }}\" sc-camel-on-click=\"{{ av.tap }}\">{{ av.ch }}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div>\n    <div style=\"font-size:11px;letter-spacing:1.5px;font-family:var(--font-heading);opacity:.7;margin-bottom:4px\">EMAIL<\u002Fdiv>\n    <input type=\"email\" value=\"{{ aEmail }}\" sc-camel-on-change=\"{{ onAEmail }}\" placeholder=\"you@email.com\" style=\"width:100%;box-sizing:border-box;border:2px solid #fff;padding:12px;font-family:var(--font-body);font-weight:600;font-size:15px;outline:none;background:#fff;color:var(--color-text)\" style-focus=\"border-color:var(--color-accent)\">\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:11px;letter-spacing:1.5px;font-family:var(--font-heading);opacity:.7;margin-bottom:4px\">PASSWORD<\u002Fdiv>\n    <input type=\"password\" value=\"{{ aPass }}\" sc-camel-on-change=\"{{ onAPass }}\" sc-camel-on-key-down=\"{{ onAPassKey }}\" placeholder=\"6+ characters\" style=\"width:100%;box-sizing:border-box;border:2px solid #fff;padding:12px;font-family:var(--font-body);font-weight:600;font-size:15px;outline:none;background:#fff;color:var(--color-text)\" style-focus=\"border-color:var(--color-accent)\">\n  <\u002Fdiv>\n  <sc-if value=\"{{ aErrShow }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"font-size:12px;font-family:var(--font-heading);font-weight:700;color:#ffe814\">{{ aErr }}<\u002Fdiv>\n  <\u002Fsc-if>\n  <button style=\"border:none;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-weight:800;font-size:16px;letter-spacing:1.5px;padding:14px;cursor:pointer\" style-hover=\"background:var(--color-accent-600)\" sc-camel-on-click=\"{{ onAuthGo }}\">{{ authBtnLabel }}<\u002Fbutton>\n  <button style=\"border:none;background:transparent;color:#fff;font-family:var(--font-heading);font-size:12px;letter-spacing:1px;cursor:pointer;text-decoration:underline;padding:6px\" sc-camel-on-click=\"{{ onAuthSwitch }}\">{{ authSwitchLabel }}<\u002Fbutton>\n  <div style=\"font-size:11px;opacity:.55;line-height:1.5\">Your account syncs online when connected — stats and rankings follow you across devices. Offline, it falls back to this device.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isProfile }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Profile\" style=\"flex:1;display:flex;flex-direction:column;padding:18px 20px 24px;gap:14px;overflow:auto\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between\">\n    <button class=\"btn btn-ghost\" style=\"padding-left:0\" sc-camel-on-click=\"{{ onHome }}\">← Back<\u002Fbutton>\n    <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ onSignOut }}\">Sign out<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:14px;align-items:center\">\n    <div style=\"{{ prGlyphSt }}\">{{ prGlyph }}<\u002Fdiv>\n    <div style=\"min-width:0\">\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:24px;line-height:1.05\">{{ prName }}<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700);overflow:hidden;text-overflow:ellipsis\">{{ prEmail }}<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:1.5px;color:var(--color-neutral-600);margin-top:3px\">{{ prJoined }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid var(--color-divider);padding-top:12px;font-family:var(--font-heading);font-size:11px;letter-spacing:2px;color:var(--color-neutral-600)\">LIFETIME STATS<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n    <sc-for list=\"{{ statCards }}\" as=\"sc\" hint-placeholder-count=\"8\">\n      <div style=\"border:2px solid var(--color-divider);background:#fff;padding:12px\">\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px\">{{ sc.v }}<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.5px;color:var(--color-neutral-600);margin-top:2px\">{{ sc.k }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isBoard }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Rankings\" style=\"flex:1;display:flex;flex-direction:column;min-height:0;background:var(--color-bg)\">\n  <div style=\"background:#1c0530;color:#fff;padding:16px 20px 0;display:flex;flex-direction:column;gap:7px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between\">\n      <button class=\"btn btn-ghost\" style=\"padding-left:0;color:#fff;white-space:nowrap;flex:none\" sc-camel-on-click=\"{{ onHome }}\">← Home<\u002Fbutton>\n      <div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:2px;color:#ffe814\">{{ boardScopeLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:30px;line-height:.95;color:#ffe814\">{{ boardTitle }}<\u002Fdiv>\n    <div style=\"font-size:12px;opacity:.82;line-height:1.4;text-wrap:pretty\">{{ boardSub }}<\u002Fdiv>\n    <div style=\"display:flex;margin-top:5px\">\n      <button style=\"{{ tabTodaySt }}\" sc-camel-on-click=\"{{ onTabToday }}\">TODAY<\u002Fbutton>\n      <button style=\"{{ tabWeeklySt }}\" sc-camel-on-click=\"{{ onTabWeekly }}\">WEEKLY<\u002Fbutton>\n      <button style=\"{{ tabAllSt }}\" sc-camel-on-click=\"{{ onTabAll }}\">ALL-TIME<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow:auto;padding:14px 20px 22px;display:flex;flex-direction:column;gap:9px\">\n    <sc-if value=\"{{ boardIsToday }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"border:2px solid var(--color-text);background:#fff;padding:9px 12px;font-family:var(--font-heading);font-size:10px;letter-spacing:1.5px\">ONE FILM · ONE BOARD · EVERYBODY<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ boardLoading }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:22px 0;text-align:center;font-family:var(--font-heading);font-size:12px;letter-spacing:2px;color:var(--color-neutral-600)\">LOADING…<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ boardEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:2px solid var(--color-text);background:#fff;padding:20px 18px;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:20px;line-height:1.1\">{{ emptyHead }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--color-neutral-700);text-wrap:pretty\">{{ emptyBody }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ boardOffline }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:2px solid var(--color-neutral-400);background:var(--color-neutral-200);padding:11px;font-size:12px;color:var(--color-neutral-700)\">You're offline — showing your own score only.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-for list=\"{{ podium }}\" as=\"pd\" hint-placeholder-count=\"3\">\n      <div style=\"{{ pd.cardSt }}\">\n        <div style=\"{{ pd.rankSt }}\">{{ pd.rank }}<\u002Fdiv>\n        <div style=\"{{ pd.gSt }}\">{{ pd.g }}<\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-family:var(--font-heading);font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ pd.name }}<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.5px;opacity:.7\">{{ pd.tag }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:23px;flex:none\">{{ pd.val }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ hasRest }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:2px;background:var(--color-divider);border:2px solid var(--color-divider)\">\n        <sc-for list=\"{{ restRows }}\" as=\"br\" hint-placeholder-count=\"7\">\n          <div style=\"{{ br.rowSt }}\">\n            <div style=\"font-family:var(--font-heading);font-weight:800;font-size:13px;width:26px;flex:none;color:var(--color-neutral-600)\">{{ br.rank }}<\u002Fdiv>\n            <div style=\"{{ br.gSt }}\">{{ br.g }}<\u002Fdiv>\n            <div style=\"flex:1;min-width:0;font-family:var(--font-heading);font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ br.name }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;flex:none\">{{ br.val }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ boardYouShow }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:2px solid var(--color-accent);background:var(--color-accent);color:#fff;padding:11px 12px;font-family:var(--font-heading);font-weight:800;font-size:14px;letter-spacing:.5px\">{{ boardYouLine }}<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ boardSignedOut }}\" hint-placeholder-val=\"{{ false }}\">\n      <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ onProfile }}\">Sign in to claim your rank<\u002Fbutton>\n    <\u002Fsc-if>\n    <div style=\"font-size:11px;color:var(--color-neutral-600);line-height:1.5\">{{ boardNote }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ howToOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:absolute;inset:0;background:rgba(32,30,29,.6);display:flex;align-items:center;padding:24px;z-index:5\">\n  <div style=\"background:#fff;color:var(--color-text);border:2px solid var(--color-text);padding:22px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:80%;overflow:auto\">\n    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px\">How to play<\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:baseline\"><div style=\"width:8px;height:8px;background:var(--color-accent);flex:none\"><\u002Fdiv><div style=\"font-size:13px;line-height:1.5;color:var(--color-neutral-800)\">Guess the movie letter by letter — <b>9 wrong guesses<\u002Fb> and you're out.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:baseline\"><div style=\"width:8px;height:8px;background:var(--color-accent);flex:none\"><\u002Fdiv><div style=\"font-size:13px;line-height:1.5;color:var(--color-neutral-800)\"><b>Solo mode:<\u002Fb> 150 levels, three hearts. Lose a level and you drop a heart but keep your place — lose all three and it's back to Level 1.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:baseline\"><div style=\"width:8px;height:8px;background:var(--color-accent);flex:none\"><\u002Fdiv><div style=\"font-size:13px;line-height:1.5;color:var(--color-neutral-800)\"><b>Clues cost points:<\u002Fb> every level starts at 10. Tap CLUES for year, actor, actress, director or the famous line — past Level {{ letterUnlockLv }} a free letter joins the list too. Each one taps a few points off; solve clean for the full 10. Run out of points or clues and we reveal the title and offer a restart, no heart lost.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:baseline\"><div style=\"width:8px;height:8px;background:var(--color-accent);flex:none\"><\u002Fdiv><div style=\"font-size:13px;line-height:1.5;color:var(--color-neutral-800)\"><b>Daily Challenge:<\u002Fb> one film a day — the same one for everybody, nothing to pick. A clue drops every 15 seconds and the points drop with it, 1000 down to 200. Name it as early as you can.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:baseline\"><div style=\"width:8px;height:8px;background:var(--color-accent);flex:none\"><\u002Fdiv><div style=\"font-size:13px;line-height:1.5;color:var(--color-neutral-800)\"><b>Trap a Friend:<\u002Fb> seal a film at Fair, Sneaky or Brutal and send the link. They get four clues and a few tries to name it before the trap closes — a receipt tells you if they escaped or got caught.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:baseline\"><div style=\"width:8px;height:8px;background:var(--color-accent);flex:none\"><\u002Fdiv><div style=\"font-size:13px;line-height:1.5;color:var(--color-neutral-800)\"><b>Imposter:<\u002Fb> one phone, 3+ players. Everyone but the secret Imposter knows the film; each gives one spoken clue, then the table votes in secret. Catch the Imposter and they get one last guess to steal the round back.<\u002Fdiv><\u002Fdiv>\n    <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onCloseHowTo }}\">Got it<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTrapInbox }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Traps\" style=\"flex:1;display:flex;flex-direction:column;min-height:0;background:var(--color-bg);overflow:auto\">\n  <div style=\"background:#1c0530;color:#fff;padding:16px 20px 14px;flex:none\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px\">\n      <button class=\"btn btn-ghost\" style=\"padding-left:0;color:#fff;white-space:nowrap;flex:none;font-family:var(--font-heading);font-size:13px\" sc-camel-on-click=\"{{ onHome }}\">← HOME<\u002Fbutton>\n      <button style=\"background:#ffe814;border:3px solid #ffe814;color:#1c0530;font-family:var(--font-heading);font-size:11px;padding:8px 11px;cursor:pointer;white-space:nowrap\" sc-camel-on-click=\"{{ onTrapBuild }}\">+ NEW TRAP<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-family:var(--font-heading);font-size:34px;line-height:.94;color:#ffe814\">TRAPS<\u002Fdiv>\n    <div style=\"display:flex;gap:18px;margin-top:12px\">\n      <div><div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.5px;color:var(--color-neutral-600)\">ESCAPED<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:22px;color:#fff\">{{ tEscaped }}<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.5px;color:var(--color-neutral-600)\">CAUGHT<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:22px;color:#ff8fc0\">{{ tCaught }}<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.5px;color:var(--color-neutral-600)\">SENT<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:22px;color:#fff\">{{ tSentCount }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:16px 18px 26px;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:1.6px;color:var(--color-accent-800)\">WAITING FOR YOU · {{ tInboxCount }}<\u002Fdiv>\n    <sc-for list=\"{{ tInboxRows }}\" as=\"r\" hint-placeholder-count=\"1\">\n      <button sc-camel-on-click=\"{{ r.open }}\" style=\"border:3px solid var(--color-text);background:{{ r.bg }};padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;box-shadow:5px 5px 0 var(--color-text)\" style-hover=\"transform:translate(1px,1px);box-shadow:3px 3px 0 var(--color-text)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:3px solid var(--color-text);width:100%\">\n          <span style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:1.2px;color:var(--color-text)\">FROM {{ r.from }}<\u002Fspan>\n          <span style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1px;color:var(--color-neutral-700)\">{{ r.ago }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:12px;display:flex;flex-direction:column;gap:5px;width:100%\">\n          <span style=\"font-family:var(--font-heading);font-size:16px;line-height:1;color:var(--color-text)\">{{ r.headline }}<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:800;color:var(--color-neutral-700)\">{{ r.sub }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ tInboxEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"border:3px solid var(--color-text);background:#ffe814;padding:14px;display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-family:var(--font-heading);font-size:15px;line-height:1.1;color:var(--color-text)\">NOBODY HAS TRAPPED YOU YET.<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.45;font-weight:800;color:var(--color-neutral-700)\">Traps only exist if somebody sends one. Go first — they will send one straight back.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onTrapBuild }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;border:3px solid var(--color-text);background:var(--color-accent);color:#fff;padding:13px;font-family:var(--font-heading);font-size:12px;text-align:left;cursor:pointer\"><span>SET THE FIRST ONE<\u002Fspan><span>→<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tHasSent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"height:3px;background:var(--color-text);margin:8px 0 4px\"><\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ tHasSent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:1.6px;color:var(--color-accent-800)\">YOUR SENT TRAPS<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-for list=\"{{ tSentRows }}\" as=\"r\" hint-placeholder-count=\"0\">\n      <div style=\"border:3px solid var(--color-text);background:var(--color-neutral-100);display:flex;flex-direction:column\">\n        <div style=\"padding:11px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px\">\n          <div style=\"min-width:0\">\n            <div style=\"font-family:var(--font-heading);font-size:13px;color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.to }}<\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:800;color:var(--color-neutral-600)\">{{ r.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1px;background:{{ r.chipBg }};color:{{ r.chipFg }};border:2px solid var(--color-text);padding:6px 8px;white-space:nowrap\">{{ r.status }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ r.hasBoard }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top:3px solid var(--color-text);background:#ffe814;display:flex;flex-direction:column\">\n            <div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.4px;color:var(--color-accent-800);padding:8px 12px 4px\">THE BOARD<\u002Fdiv>\n            <sc-for list=\"{{ r.board }}\" as=\"b\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:2px solid var(--color-text)\">\n                <span style=\"font-family:var(--font-heading);font-size:11px;color:var(--color-neutral-700);width:18px;flex:none\">{{ b.rank }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading);font-size:12px;color:var(--color-text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ b.name }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading);font-size:11px;color:{{ b.vfg }};white-space:nowrap\">{{ b.verdict }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTrapBuild }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Trap Setup\" style=\"flex:1;display:flex;flex-direction:column;min-height:0;background:var(--color-bg);overflow:auto\">\n  <div style=\"padding:14px 20px 0;display:flex;align-items:center;justify-content:space-between;flex:none\">\n    <button class=\"btn btn-ghost\" style=\"padding-left:0;white-space:nowrap;flex:none;font-family:var(--font-heading);font-size:12px;letter-spacing:1.2px\" sc-camel-on-click=\"{{ onTrapInbox }}\">← TRAPS<\u002Fbutton>\n    <div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:1.5px;color:var(--color-accent-800)\">{{ tBuildStep }}<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:12px 20px 26px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-family:var(--font-heading);font-size:32px;line-height:.94;color:var(--color-text)\">SET THE<br>TRAP.<\u002Fdiv>\n\n    <sc-if value=\"{{ tNeedsName }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:3px solid var(--color-text);background:#ff8fc0;padding:12px;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.5px;color:var(--color-accent-800)\">SIGN THE TRAP<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.45;font-weight:800;color:var(--color-text)\">Your name travels with the link. Without it the trap turns up from “SOMEONE” and loses its whole point.<\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <input value=\"{{ tMeDraft }}\" sc-camel-on-change=\"{{ onTMeDraft }}\" placeholder=\"Your name…\" style=\"flex:1;min-width:0;border:3px solid var(--color-text);background:var(--color-neutral-100);color:var(--color-text);padding:12px;font-weight:800;font-family:var(--font-body);outline:none\">\n          <button sc-camel-on-click=\"{{ onSaveMyName }}\" style=\"border:3px solid var(--color-text);background:var(--color-text);color:#ffe814;padding:12px 14px;font-family:var(--font-heading);font-size:11px;cursor:pointer;white-space:nowrap\">SAVE<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ tHasName }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:1.5px;color:var(--color-neutral-600)\">SIGNED AS {{ tMyName }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div>\n      <div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:1.5px;color:var(--color-neutral-700);margin-bottom:7px\">1 · WHO GETS IT<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <sc-for list=\"{{ tAudOpts }}\" as=\"o\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ o.pick }}\" style=\"flex:1;border:3px solid var(--color-text);background:{{ o.bg }};color:{{ o.fg }};padding:12px 8px;font-family:var(--font-heading);font-size:11px;line-height:1.25;cursor:pointer;text-align:left\">{{ o.label }}<br><span style=\"font-size:9px;opacity:.75\">{{ o.sub }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ tIsFriend }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:9px\">\n          <sc-for list=\"{{ tFriendChips }}\" as=\"f\" hint-placeholder-count=\"0\">\n            <button sc-camel-on-click=\"{{ f.pick }}\" style=\"border:3px solid var(--color-text);background:{{ f.bg }};color:{{ f.fg }};padding:10px 12px;font-family:var(--font-heading);font-size:11px;cursor:pointer\">{{ f.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ tIsFriend }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;gap:8px;margin-top:9px\">\n          <input value=\"{{ tToNew }}\" sc-camel-on-change=\"{{ onTToNew }}\" placeholder=\"Add a name…\" style=\"flex:1;min-width:0;border:3px solid var(--color-text);background:var(--color-neutral-100);color:var(--color-text);padding:12px;font-weight:800;font-family:var(--font-body);outline:none\">\n          <button sc-camel-on-click=\"{{ onAddFriend }}\" style=\"border:3px solid var(--color-text);background:var(--color-neutral-100);color:var(--color-text);padding:12px 14px;font-family:var(--font-heading);font-size:11px;cursor:pointer;white-space:nowrap\">ADD<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ tIsGroup }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:3px solid var(--color-text);background:var(--color-neutral-200);padding:12px;margin-top:9px;font-size:12px;line-height:1.45;font-weight:800;color:var(--color-neutral-800)\">One link, one film, the whole chat. Everyone who plays sends a receipt back and you get a board instead of a single result.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:1.5px;color:var(--color-neutral-700);margin-bottom:7px\">2 · CRUELTY<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <sc-for list=\"{{ tDiffOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ o.pick }}\" style=\"flex:1;border:3px solid var(--color-text);background:{{ o.bg }};color:{{ o.fg }};padding:12px 6px;font-family:var(--font-heading);font-size:10px;line-height:1.25;cursor:pointer;text-align:left\">{{ o.label }}<br><span style=\"font-size:9px;opacity:.75\">{{ o.pts }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"border:3px solid var(--color-text);background:#ffe814;padding:12px;margin-top:10px\">\n        <div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.5px;color:var(--color-accent-800);margin-bottom:5px\">THEY WILL OPEN WITH<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-size:14px;line-height:1.2;color:var(--color-text)\">{{ tPreview }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:1.5px;color:var(--color-neutral-700);margin-bottom:7px\">3 · THE FILM · TAP TO SEAL<\u002Fdiv>\n      <input value=\"{{ tQ }}\" sc-camel-on-change=\"{{ onTQ }}\" placeholder=\"Search the catalogue…\" style=\"width:100%;border:3px solid var(--color-text);background:var(--color-neutral-100);color:var(--color-text);padding:12px;font-weight:800;font-family:var(--font-body);outline:none\">\n      <div style=\"max-height:190px;overflow:auto;border:3px solid var(--color-text);border-top:none;background:var(--color-neutral-100)\">\n        <sc-for list=\"{{ tPickRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ r.pick }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:none;border-bottom:2px solid var(--color-neutral-300);background:{{ r.bg }};padding:12px;cursor:pointer;text-align:left\">\n            <span style=\"font-family:var(--font-heading);font-size:12px;color:var(--color-text)\">{{ r.t }}<\u002Fspan>\n            <span style=\"font-size:10px;font-weight:800;color:var(--color-neutral-600);white-space:nowrap\">{{ r.meta }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ tNoMatch }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px;font-size:12px;font-weight:800;color:var(--color-neutral-600)\">Nothing in the catalogue matches that.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <button sc-camel-on-click=\"{{ onTrapArm }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;border:3px solid var(--color-text);background:{{ tArmBg }};color:{{ tArmFg }};padding:15px 14px;font-family:var(--font-heading);font-size:13px;text-align:left;box-shadow:5px 5px 0 var(--color-text);cursor:pointer\">\n      <span>{{ tArmLabel }}<\u002Fspan><span>→<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTrapArmed }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Trap Armed\" style=\"flex:1;display:flex;flex-direction:column;min-height:0;background:#1c0530;color:#fff;overflow:auto\">\n  <div style=\"padding:16px 20px 0;flex:none\">\n    <button class=\"btn btn-ghost\" style=\"padding-left:0;color:#fff;white-space:nowrap;flex:none;font-family:var(--font-heading);font-size:12px\" sc-camel-on-click=\"{{ onTrapInbox }}\">← TRAPS<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"padding:14px 20px 26px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:2px;color:#ffe814\">{{ tArmedKicker }}<\u002Fdiv>\n    <div style=\"font-family:var(--font-heading);font-size:36px;line-height:.92;color:#ffe814\">ARMED FOR<br>{{ tArmedTo }}.<\u002Fdiv>\n    <div style=\"border:3px solid #ffe814;padding:13px\">\n      <div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.5px;color:#ff8fc0;margin-bottom:6px\">SEALED FILM · ONLY YOU SEE THIS<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-size:20px;line-height:1;color:#fff\">{{ tFilmTitle }}<\u002Fdiv>\n      <div style=\"font-size:11px;font-weight:800;color:var(--color-neutral-600);margin-top:6px\">{{ tFilmMeta }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-neutral-800);border:2px solid var(--color-neutral-600);padding:12px;font-size:11px;font-weight:800;color:var(--color-neutral-300);word-break:break-all\">{{ tLink }}<\u002Fdiv>\n    <button sc-camel-on-click=\"{{ onTrapShare }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;border:3px solid #ffe814;background:#ffe814;color:var(--color-text);padding:15px 14px;font-family:var(--font-heading);font-size:13px;text-align:left;cursor:pointer\"><span>{{ tShareLabel }}<\u002Fspan><span>↗<\u002Fspan><\u002Fbutton>\n    <div style=\"font-size:12px;line-height:1.5;font-weight:700;color:var(--color-neutral-300)\">The title never travels. The link carries a fingerprint their app resolves against the same catalogue — screenshot the URL and you still know nothing.<\u002Fdiv>\n    <button sc-camel-on-click=\"{{ onTrapPreview }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;border:3px solid var(--color-neutral-600);background:transparent;color:var(--color-neutral-300);padding:13px;font-family:var(--font-heading);font-size:11px;text-align:left;cursor:pointer\" style-hover=\"border-color:#ff8fc0;color:#ff8fc0\"><span>PREVIEW WHAT THEY SEE<\u002Fspan><span>👁<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTrapPlay }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Trap Play\" style=\"flex:1;display:flex;flex-direction:column;min-height:0;background:#1c0530;color:#fff;overflow:auto\">\n  <sc-if value=\"{{ tPreviewing }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:none;background:#ff8fc0;color:var(--color-text);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px\">\n      <span style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.2px\">PREVIEW · NOTHING COUNTS<\u002Fspan>\n      <button sc-camel-on-click=\"{{ onTrapInbox }}\" style=\"background:none;border:none;font-family:var(--font-heading);font-size:9px;letter-spacing:1.2px;color:var(--color-text);cursor:pointer;padding:0\">CLOSE ✕<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px;flex:none\">\n    <button class=\"btn btn-ghost\" style=\"padding-left:0;color:#fff;white-space:nowrap;flex:none;font-family:var(--font-heading);font-size:12px;letter-spacing:1.2px\" sc-camel-on-click=\"{{ onTrapLater }}\">← LATER<\u002Fbutton>\n    <div style=\"display:flex;gap:6px\">\n      <sc-for list=\"{{ tStrikePips }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div style=\"width:22px;height:10px;background:{{ p.bg }};border:2px solid #ffe814\"><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:6px 18px 26px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"font-family:var(--font-heading);font-size:10px;letter-spacing:2px;color:#ff8fc0\">{{ tPlayHead }}<\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:10px\">\n      <div style=\"font-family:var(--font-heading);font-size:30px;line-height:.94;color:#ffe814\">NAME<br>THE FILM.<\u002Fdiv>\n      <div style=\"text-align:right\"><div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.2px;color:var(--color-neutral-600)\">POT<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:32px;line-height:1;color:var(--color-accent)\">{{ tPot }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <sc-for list=\"{{ tClueCards }}\" as=\"c\" hint-placeholder-count=\"1\">\n        <div style=\"border:3px solid {{ c.border }};background:{{ c.bg }};padding:13px\">\n          <div style=\"font-family:var(--font-heading);font-size:9px;letter-spacing:1.6px;color:{{ c.kFg }};margin-bottom:5px\">{{ c.k }}<\u002Fdiv>\n          <div style=\"fon urn [0, 0]; } })()\n  };\n  loadJSON(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }\n  accounts() { return this.loadJSON('bh_accounts', {}); }\n  me() { if (this._fbProfile) return this._fbProfile; const p = this.loadJSON('bh_profile', null); if (!p) return null; const a = this.accounts()[p.email]; return a ? { ...a, email: p.email } : null; }\n  weekKey(d) {\n    d = d || new Date();\n    const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));\n    const day = (dt.getUTCDay() + 6) % 7;\n    dt.setUTCDate(dt.getUTCDate() - day + 3);\n    const firstThu = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));\n    const wk = 1 + Math.round((dt - firstThu) / 6048e5);\n    return dt.getUTCFullYear() + '-W' + String(wk).padStart(2, '0');\n  }\n  fetchBoard(scope) {\n    if (!this.fb) return;\n    const p = (scope === 'weekly' && this.fb.weeklyBoard) ? this.fb.weeklyBoard(this.weekKey()) : this.fb.topBoard('topScore', false);\n    p.then(rows => { this._live = rows; this._liveTab = scope; this.forceUpdate(); }).catch(() => {});\n  }\n  statsOf() { return this.loadJSON('bh_stats', {}); }\n  bump(fn) {\n    const st = this.statsOf(); fn(st);\n    try { localStorage.setItem('bh_stats', JSON.stringify(st)); } catch (e) {}\n    if (this.fb && this.fb.user) { clearTimeout(this._ps); this._ps = setTimeout(() => this.fb.pushStats(this.statsOf()), 1500); }\n  }\n  authGo() {\n    const s = this.state, em = s.aEmail.trim().toLowerCase(), acc = this.accounts();\n    if (!/^\\S+@\\S+\\.\\S+$/.test(em)) { this.setState({ aErr: 'Enter a valid email.' }); return; }\n    if ((s.aPass || '').length < 6) { this.setState({ aErr: 'Password needs 6+ characters.' }); return; }\n    if (this.fb) {\n      const name = (s.aName.trim() || em.split('@')[0]).toUpperCase().slice(0, 16);\n      this.setState({ aBusy: true });\n      const p = s.aMode === 'up' ? this.fb.signUp(em, s.aPass, name, s.aAvatar) : this.fb.signIn(
